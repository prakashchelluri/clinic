# Render Blueprint: free web service plus a free Render Postgres so the app runs out of the box.
# To use Neon instead: in the Render dashboard open the service -> Environment, set DATABASE_URL to the Neon pooled
# connection string (remove the fromDatabase link here first, or the blueprint will keep resetting it).
databases:
  - name: cubott-db
    plan: free
    databaseName: cubott
    user: cubott

services:
  - type: web
    name: cubott-clinical
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cubott-db
          property: connectionString
      # Uploads (clinical photos, reports) go to Cloudflare R2; Render's own disk is wiped on every restart.
      - key: S3_ENDPOINT
        value: https://15272c82fc1db1d2ae347f89ca9c55d6.r2.cloudflarestorage.com
      - key: S3_BUCKET
        value: cubott
      - key: S3_REGION
        value: auto
      # Secrets: create an R2 API token (Object Read & Write, this bucket) and paste its two keys in the Render dashboard.
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
