# Render Blueprint: free web service. The database is an external Postgres (Aiven free, since Nov 2026; Render's
# free Postgres expired). DATABASE_URL is a secret: paste it in the Render dashboard -> service -> Environment.
services:
  - type: web
    name: cubott-clinical
    runtime: node
    plan: free
    # --include=dev: vite, typescript and react are dev dependencies, and npm ci leaves them out when NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # secure cookies, HSTS, and no development defaults (the server refuses to start without COOKIE_SECRET)
      - key: NODE_ENV
        value: production
      # This deployment is the demo: make the demo clinic (six demo1234 accounts) on an empty database. Never set it for a real clinic.
      - key: SEED_DEMO
        value: "1"
      # The CUBOTT platform admin (superadmin@cubott.in). Without it the account is switched off. Paste a long password in the dashboard.
      - key: SUPERADMIN_PASSWORD
        sync: false
      # Not set yet: TRUST_PROXY (the number of proxies in front of the app). Until it is, every request appears to come from Render's
      # proxy, so "work only from the clinic" and the per-address login limit cannot tell people apart. Set it, then check that
      # Settings › Privacy shows your own public address.
      # This deployment is the demo: show the demo accounts on the sign-in page (read at build time). Never set it for a real clinic.
      - key: VITE_DEMO_LOGIN
        value: "1"
      - key: COOKIE_SECRET
        generateValue: true
      # postgres://user:pass@host:port/db?sslmode=require (never commit it)
      - key: DATABASE_URL
        sync: false
      # Uploads (clinical photos, reports) go to Cloudflare R2; Render's own disk is wiped on every restart.
      - key: S3_ENDPOINT
        value: https://15272c82fc1db1d2ae347f89ca9c55d6.r2.cloudflarestorage.com
      - key: S3_BUCKET
        value: cubott
      - key: S3_REGION
        value: auto
      # Secrets: create an R2 API token (Object Read & Write, this bucket) and paste its two keys in the Render dashboard.
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
