# Render Blueprint: free web service plus a free Render Postgres so the app runs out of the box.
# To use Neon instead: in the Render dashboard open the service -> Environment, set DATABASE_URL to the Neon pooled
# connection string (remove the fromDatabase link here first, or the blueprint will keep resetting it).
databases:
  - name: cubott-db
    plan: free
    databaseName: cubott
    user: cubott

services:
  - type: web
    name: cubott-clinical
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cubott-db
          property: connectionString
